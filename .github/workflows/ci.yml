name: check

on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [dev]
  workflow_dispatch:

permissions: {}

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@ca07bd07d12c91f103ce481372100cab6c83d72f # v0.6.34
    permissions:
      contents: read
    with:
      setup: true
      timeout-minutes: 60
      fetch-depth: 0
      artifact: dist/qualified-linux.zip
      artifact-name: qualified-linux
