name: check

on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [dev]
  workflow_dispatch:

permissions: {}

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@9fead1382c452a6b791a0a9e464ac6ac66537ac3 # v0.6.51
    permissions:
      contents: read
    with:
      setup: true
      timeout-minutes: 60
      fetch-depth: 0
      artifact: dist/qualified-linux.zip
      artifact-name: qualified-linux
