# Version proposals wait three days and target dev; acceptance still requires qualified pins.
# Daily security scanning remains in workflows/security.yml.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    rebase-strategy: disabled
    schedule:
      interval: daily
    cooldown:
      default-days: 3
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
  - package-ecosystem: cargo
    directory: /
    target-branch: dev
    rebase-strategy: disabled
    schedule:
      interval: daily
    cooldown:
      default-days: 3
    open-pull-requests-limit: 1
    groups:
      rust:
        patterns: ['*']
    commit-message:
      prefix: build
  - package-ecosystem: bun
    directories: ['/', '/tools/codegen']
    target-branch: dev
    rebase-strategy: disabled
    schedule:
      interval: daily
    cooldown:
      default-days: 3
    open-pull-requests-limit: 1
    groups:
      javascript:
        patterns: ['*']
    commit-message:
      prefix: build
