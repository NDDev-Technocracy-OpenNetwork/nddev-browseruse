<!doctype html>
<html lang="en" data-platform="desktop" data-density="compact" data-direction="on">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>nddev-browseruse</title>
    <link rel="stylesheet" href="styles/fonts.css" />
    <link rel="stylesheet" href="vendor/design-system/tokens.css" />
    <link rel="stylesheet" href="vendor/design-system/kit.css" />
    <link rel="stylesheet" href="styles/popup.css" />
  </head>
  <body data-link="down" data-consent="true">
    <header>
      <img src="icons/icon-32.png" alt="" />
      <h1 data-i18n="title"></h1>
      <span class="pill" role="status" aria-live="polite">
        <span class="dot"></span><span id="link" data-i18n="linkDown"></span>
      </span>
    </header>
    <p id="mismatch" class="notice" hidden></p>
    <p id="setup" class="notice setup" hidden>
      <span data-i18n="setupNeeded"></span>
      <a id="install-link" target="_blank" rel="noreferrer" data-i18n="setupLink"></a>
    </p>

    <section id="consent" aria-labelledby="consent-title" hidden>
      <h2 id="consent-title" data-i18n="consentTitle"></h2>
      <p data-i18n="consentPurpose"></p>
      <p data-i18n="consentData"></p>
      <p id="previous-choice" class="muted"></p>
      <div class="consent-options">
        <button class="nd-button nd-button--secondary" data-consent-profile="full" data-i18n="useFull" type="button"></button>
        <button class="nd-button nd-button--secondary" data-consent-profile="standard" data-i18n="useStandard" type="button"></button>
        <button class="nd-button nd-button--secondary" data-consent-profile="off" data-i18n="useOff" type="button"></button>
      </div>
      <a id="consent-privacy" target="_blank" rel="noreferrer" data-i18n="privacyPolicy"></a>
    </section>
    <section aria-labelledby="control-title">
      <div class="row">
        <div class="grow">
          <div id="control-title" class="strong" data-i18n="controlTitle"></div>
          <p id="control-note" class="muted"></p>
        </div>
        <button id="toggle" class="switch" role="switch" aria-checked="false" aria-labelledby="control-title" disabled></button>
      </div>
      <hr class="divider" />
      <div class="observe">
      <h2 id="observation-title" data-i18n="observationTitle"></h2>
      <div class="segments" role="group" aria-labelledby="observation-title">
        <button type="button" data-profile="full" aria-pressed="false" disabled data-i18n="full"></button>
        <button type="button" data-profile="standard" aria-pressed="false" disabled data-i18n="standard"></button>
        <button type="button" data-profile="off" aria-pressed="false" disabled data-i18n="off"></button>
      </div>
      </div>
      <p id="observation" class="muted"></p>
    </section>

    <section aria-labelledby="tab-title">
      <h2 id="tab-title" data-i18n="tabTitle"></h2>
      <div class="row">
        <div id="tab-state" class="grow strong"></div>
        <button id="private-add" class="button small nd-button nd-button--secondary" type="button" disabled data-i18n="privateAddAny"></button>
      </div>
      <p id="tab-note" class="muted" hidden></p>
      <div class="actions">
        <button id="record" class="button primary nd-button" type="button" disabled hidden>
          <span class="dot"></span><span id="record-label" data-i18n="record"></span>
        </button>
      </div>
      <p id="recording" class="muted" aria-live="polite" hidden></p>
    </section>

    <section id="activity" aria-labelledby="activity-title" hidden>
      <h2 id="activity-title" data-i18n="activityTitle"></h2>
      <ol id="recent" class="steps"></ol>
      <p id="recent-note" class="muted"></p>
    </section>

    <section aria-labelledby="private-title">
      <h2 id="private-title" data-i18n="privateTitle"></h2>
      <p id="private-note" class="muted" data-i18n="privateNote"></p>
      <ul id="private" class="chips"></ul>
    </section>

    <footer>
      <span id="versions"></span>
      <a id="guide-link" target="_blank" rel="noreferrer" data-i18n="guide"></a>
      <a id="privacy-link" target="_blank" rel="noreferrer" data-i18n="privacyPolicy"></a>
      <span class="languages" role="group" data-i18n-aria="languageTitle">
        <button type="button" data-language="en" aria-pressed="false">EN</button>
        <button type="button" data-language="ru" aria-pressed="false">RU</button>
        <button type="button" data-language="kk" aria-pressed="false">ҚАЗ</button>
        <button type="button" data-language="ar" aria-pressed="false" lang="ar">ع</button>
        <button type="button" data-language="zh-CN" aria-pressed="false" lang="zh-CN">中文</button>
      </span>
    </footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>
