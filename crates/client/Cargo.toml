[package]
name = "nddev-browseruse-client"
version.workspace = true
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/NDDev-Technocracy-OpenNetwork/nddev-browseruse"

[dependencies]
nddev-browseruse-contract = { path = "../contract" }
nddev-browseruse-local-transport = { path = "../local-transport" }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
