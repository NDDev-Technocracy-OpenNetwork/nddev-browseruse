[package]
name = "nddev-browseruse"
version.workspace = true
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
authors = ["NDDev OpenNetwork"]
homepage = "https://nddev.ai"
repository = "https://github.com/NDDev-Technocracy-OpenNetwork/nddev-browseruse"

[workspace]
members = ["tools", "crates/contract", "crates/client", "crates/local-transport"]
resolver = "3"

[workspace.package]
version = "0.2.7"

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = "deny"

[[bin]]
name = "nddev-browseruse"
path = "src/bin/nddev-browseruse.rs"

[dependencies]
base64 = "=0.23.1"
toml = "=1.2.0"
nddev-browseruse-contract = { path = "crates/contract" }
nddev-browseruse-client = { path = "crates/client" }
nddev-browseruse-local-transport = { path = "crates/local-transport" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(any(unix, windows))'.dependencies]
tracing = "0.1"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "registry", "std"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
getrandom = "0.4"
percent-encoding = "2.3"
regex = { version = "1.13", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }
sha2 = "0.11"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "process", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["process"] }

# Windows has AF_UNIX sockets but tokio does not drive them; async-io does, without unsafe code.
[target.'cfg(windows)'.dependencies]
windows-registry = "0.100"

[dev-dependencies]
sha2 = "0.11"
tempfile = "3"

[lints]
workspace = true

# The installed host: thin LTO and one codegen unit make it about a quarter smaller (11.9 to
# 9.0 MB) at the same start-up, and symbols stay for readable panics, as in the RDS host.
[profile.release]
lto = "thin"
codegen-units = 1
